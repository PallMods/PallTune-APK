name: Optimize PallTune website animations

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/optimize_site_animations.py'
      - '.github/workflows/optimize-site-animations.yml'

permissions:
  contents: write

concurrency:
  group: palltune-website-animations
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Create lighter WebP animations for the PallTune website
        run: python scripts/optimize_site_animations.py
      - name: Commit optimized assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/palltune-*-site.webp
          if ! git diff --cached --quiet; then
            git commit -m 'Optimize PallTune website animation assets'
            git push origin HEAD:main
          else
            echo "Website animation assets already optimized"
          fi
