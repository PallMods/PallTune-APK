name: Publish PallTune v4.3.5

on:
  push:
    paths:
      - '.github/workflows/publish-v4.3.5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Prepare verified PallTune GitHub Release
    if: github.repository == 'PallMods/PallTune-APK'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v4.3.5 >/dev/null 2>&1 || gh release create v4.3.5 \
            --draft --title 'PallTune V4.3.5' \
            --notes 'PallTune Android v4.3.5 — Musikmu, Seleramu.'
      - name: Install downloader dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Try importing original APK from MediaFire
        id: import
        continue-on-error: true
        run: python scripts/import_mediafire.py
      - name: Publish release if verified APK imported successfully
        if: steps.import.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v4.3.5 PallTune.apk --clobber
          gh release edit v4.3.5 --draft=false --latest
      - name: Report status
        run: |
          if [ '${{ steps.import.outcome }}' = 'success' ]; then
            echo 'Validated APK imported. Public release is ready.'
          else
            echo 'MediaFire import failed. Draft release exists; upload PallTune.apk and publish it manually.'
          fi
