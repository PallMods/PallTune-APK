name: Publish PallTune v4.3.5

on:
  push:
    paths:
      - '.github/workflows/publish-v4.3.5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Import verified APK and create GitHub Release
    if: github.repository == 'PallMods/PallTune-APK'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install downloader dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Download and verify original PallTune APK
        run: python scripts/import_mediafire.py
      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v4.3.5 PallTune.apk \
            --title 'PallTune V4.3.5' \
            --notes 'PallTune Android v4.3.5 — Musikmu, Seleramu.' \
            --latest
